name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go vet and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: smoke fakes build
        working-directory: tests/smoke/fakes
        run: go vet ./... && go build -o "$RUNNER_TEMP/airhatch-hostapd" ./hostapd

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck tests/*.sh tests/*/*.sh plugin/tests/run.sh daemon/testdata/*/*.sh \
              meta-raspap-airhatch/recipes-webadmin/raspap/files/servicestart.sh

  plugin:
    name: PHP lint and plugin harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: RaspAP 3.5.7
        run: git clone --depth 1 --branch 3.5.7 https://github.com/RaspAP/raspap-webgui.git "$RUNNER_TEMP/raspap-webgui"
      - name: plugin/tests/run.sh
        run: RASPAP_GIT="$RUNNER_TEMP/raspap-webgui" plugin/tests/run.sh
