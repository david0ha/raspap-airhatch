# raspap-airhatch: dhcpcd reads a per-mode render of RaspAP's /etc/dhcpcd.conf
# (docs/integration.md O5).
[Service]
ExecStartPre=/usr/sbin/airhatchd render-dhcpcd
ExecStart=
ExecStart=/sbin/dhcpcd -q --nobackground -f /run/airhatch/dhcpcd.conf
# dhcpcd 10.3.1 does not finish stopping after wlan0 lost its carrier, so a
# restart for a mode switch would wait the default 90 s.
TimeoutStopSec=5s
