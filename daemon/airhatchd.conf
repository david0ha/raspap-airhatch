# raspap-airhatch daemon settings (docs/API.md §4).
# key=value, no spaces around "=". Durations use Go syntax (45s, 5m, 1h).
# Every key is listed with its default; edit and run
# "systemctl restart airhatchd" to apply.

# Observation period.
tick=1s
# Timeout of one observation command.
observe_timeout=5s
# First client attempt after boot (saved networks only).
boot_timeout=45s
# Every later client attempt, association plus DHCP.
connect_timeout=45s
# Part of an attempt: time to reach wpa_state=COMPLETED.
assoc_timeout=30s
# How long a lost connection may stay down before the hotspot opens.
disconnect_grace=60s
# Hotspot without phones: retry the saved networks this often.
retry_interval=5m
# Hotspot with phones connected: retry anyway this often.
retry_interval_busy=15m
# Delay before a hand-off closes the hotspot, so the page reaches the phone.
handoff_delay=5s
# How long RaspAP's "Stop hotspot" keeps the hotspot closed.
off_hold=15m
# Wait after a failed hotspot open, doubled up to backoff_max.
backoff_min=5s
backoff_max=2m
# Each wait inside a hotspot open (dnsmasq active, hostapd enabled).
ap_step_timeout=10s
# Scan for nearby networks before the hotspot opens; 0s disables it.
scan_timeout=10s
# Captive portal (DNS wildcard, redirect, RFC 8908) on the hotspot.
captive=true
